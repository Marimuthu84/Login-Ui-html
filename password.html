<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password</title>
<link rel="stylesheet" href="index.css" type="text/css" media="all" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="password">
<div class="arrow">
  <a href="index.html"><i class="fas fa-arrow-left back-arrow fa-1x"></i></a>
</div>
<div class="container1">
  <h3>Reset your password</h3>

  <label for="email" class="email">Email</label>
  <div class="input-box">
    <input class="item3" id="email" type="email" placeholder="example@gmail.com">
    <i class="fa-solid fa-envelope icon"></i>
  </div>

  <div class="item5">
    <input type="number" class="item4" maxlength="1" min="0" max="9">
    <input type="number" class="item4" maxlength="1" min="0" max="9">
    <input type="number" class="item4" maxlength="1" min="0" max="9">
    <input type="number" class="item4" maxlength="1" min="0" max="9">
  </div>

  <button class="item7" type="submit">Send OTP</button>
  <p class="back">Already have an Account <a href="index.html">Click here</a></p>
  <h4>Follow Us On</h4>
  <div class="item6">
    <div class="twitter"><a href=""><i class="fab fa-github fa-2x"></i></a></div>
    <div class="facebook"><a><i class="fab fa-facebook fa-2x"></i></a></div>
    <div class="instagram"><a><i class="fab fa-instagram fa-2x"></i></a></div>
    <div class="youtube"><a href="https://youtu.be/tza4toZcExA?si=xix6BzZWmqKvwT67"><i class="fab fa-youtube fa-2x"></i></a></div>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('.item4');
  inputs.forEach((input, index) => {
    input.addEventListener('input', () => {
      const val = input.value.replace(/[^0-9]/g, '');
      input.value = val.slice(-1);
      if (val && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && input.value === '' && index > 0) {
        inputs[index - 1].focus();
      }
    });
  });
</script>
</body>
</html>
