<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="index.css" type="text/css" media="all" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="register">
<div class="arrow">
  <a href="index.html"><i class="fas fa-arrow-left back-arrow fa-1x"></i></a>
</div>
<div class="container2">
  <h2>Register</h2>

  <label class="label" for="email">Email</label>
  <div class="input-box">
    <input class="item8" id="email" type="email" placeholder="example@gmail.com">
    <i class="fa-solid fa-envelope icon"></i>
  </div>

  <label class="label" for="password">Enter Password</label>
  <div class="input-box">
    <input class="item8" id="password" type="password" placeholder="Password...">
    <i class="fa-solid fa-eye icon"></i>
  </div>

  <label class="label" for="confirm">Confirm Password</label>
  <div class="input-box">
    <input class="item8" id="confirm" type="password" placeholder="Password...">
    <i class="fa-solid fa-eye icon"></i>
  </div>

  <button type="submit">Confirm</button>
  <span class="back">
    <p>Already have an Account <a href="index.html">Click Here</a></p>
  </span>
</div>
</body>

</html>
